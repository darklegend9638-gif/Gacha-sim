name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Подготовка проекта (файлы игры лежат в корне)
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          rm -f www/sw.js
          sed -i "s#<link rel=\"manifest\" href=\"manifest.webmanifest\">##" www/index.html
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"com.gachaup.app","appName":"GachaUP","webDir":"www","backgroundColor":"#14162e"}' > capacitor.config.json

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Иконка и разрешения
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          R = 'android/app/src/main/res'
          import shutil, os
          shutil.rmtree(R + '/mipmap-anydpi-v26', ignore_errors=True)
          im = Image.open('icon-512.png').convert('RGBA')
          for n, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = R + '/mipmap-' + n
              os.makedirs(d, exist_ok=True)
              r = im.resize((s, s), Image.LANCZOS)
              r.save(d + '/ic_launcher.png')
              r.save(d + '/ic_launcher_round.png')
          PY
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

      - name: Постоянный ключ подписи (обновления ставятся поверх)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Копирование игры в проект
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --refresh-dependencies && break
            echo "Попытка $i не удалась, повтор через 30 с"; sleep 30
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Переименование
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GachaUP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GachaUP-apk
          path: GachaUP.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GachaUP, сборка ${{ github.run_number }}
          body: Скачайте GachaUP.apk, откройте на телефоне и установите.
          files: GachaUP.apk
