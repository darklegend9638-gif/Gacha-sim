<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14162e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GachaUP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">Gacha<b>UP</b></div>
    <div class="chip coins"><span>👛</span><b id="coins">–</b><em id="rate"></em></div>
    <div class="ava" id="who"></div>
  </header>
  <main id="view"><div class="center">Загрузка…</div></main>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-act="tab" data-v="summon"><i>🌀</i>Призыв</button>
    <button class="tab" data-act="tab" data-v="col"><i>📖</i>Коллекция</button>
    <button class="tab" data-act="tab" data-v="up"><i>🍀</i>Прокачка</button>
    <button class="tab" data-act="tab" data-v="bonus"><i>🎁</i>Бонусы</button>
    <button class="tab" data-act="tab" data-v="rank"><i>🏆</i>Топ</button>
    <button class="tab" data-act="tab" data-v="me"><i>👤</i>Профиль</button>
  </nav>
</div>
<div id="auth" class="auth">
  <div class="authbox">
    <div class="logo">Gacha<b>UP</b></div>
    <p class="muted" id="authHint">Войдите или создайте аккаунт, чтобы играть. Прогресс хранится в облаке и доступен с любого телефона.</p>
    <div class="rchips">
      <button class="rchip on" style="--c:#8a63ff" data-auth="login">Вход</button>
      <button class="rchip" style="--c:#8a63ff" data-auth="reg">Регистрация</button>
    </div>
    <input class="inp" id="au" maxlength="20" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Логин (латиница, цифры, _)">
    <input class="inp" id="ap" type="password" maxlength="72" autocomplete="current-password" placeholder="Пароль (от 6 символов)">
    <input class="inp" id="ap2" type="password" maxlength="72" autocomplete="new-password" placeholder="Повторите пароль" style="display:none">
    <button class="btn main" id="abtn" data-auth="go">Войти</button>
    <p class="aerr" id="aerr"></p>
  </div>
</div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
<script src="extra.js"></script>
<script src="auth.js"></script>
</body>
</html>
