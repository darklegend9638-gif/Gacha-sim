:root{
  --bg:#120e26; --bg2:#1a1436; --card:#221b47; --line:rgba(255,255,255,.09);
  --text:#f3efff; --muted:#9b93c4; --gold:#ffcf5c; --ess:#c9a4ff; --ok:#6be3a0; --bad:#ff7a8a;
  --disp:'Montserrat','Trebuchet MS',system-ui,sans-serif;
  --body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r0:#aab2c8; --r1:#5fd47a; --r2:#4aa3ff; --r3:#b565ff; --r4:#ffc447;
  --r5:#ff4d5e; --r6:#2ee6c8; --r7:#ffeaa6; --r8:#9d7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:500 15px/1.4 var(--body);overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(120% 60% at 50% 0%,#2a1f5c 0%,var(--bg) 60%)}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.chip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:7px 13px}
.chip b{font:700 14px var(--disp);letter-spacing:-.01em}
.chip.coins b{color:var(--gold)} .chip.ess b{color:var(--ess)}
.who{color:var(--muted);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
h2{font:700 18px/1.2 var(--disp);margin:6px 0 12px;letter-spacing:-.02em}
.muted{color:var(--muted)} small{font-size:12.5px}

/* ---------- ring ---------- */
.rift{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:18px auto 12px}
.ring{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 30px),#000 calc(100% - 29px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 30px),#000 calc(100% - 29px));
  filter:drop-shadow(0 0 18px rgba(157,123,255,.35))}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;
  border:10px solid transparent;border-top:16px solid var(--text);border-bottom:0;filter:drop-shadow(0 2px 4px #000a)}
.core{position:absolute;inset:38px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 35%,#2d2263,#150f30 70%);border:1px solid var(--line)}
.core .cic{font-size:64px;line-height:1;transition:transform .2s}
.core.spin .cic{animation:wob .35s infinite alternate}
@keyframes wob{to{transform:scale(1.14) rotate(8deg)}}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin:0 20px 14px}
.pity{margin:0 8px 16px}
.pity .bar{height:6px;border-radius:9px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.pity .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--r3),var(--r4))}
.pity span{display:block;text-align:center;margin-top:6px;font-size:12.5px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:13px 10px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);font-weight:700;transition:transform .12s,opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn small{font-weight:600;color:var(--muted)}
.btn.main{background:linear-gradient(135deg,#7b5cff,#c14dff);border-color:transparent;font-family:var(--disp);font-size:15px}
.btn.main small{color:#fff9}
.btn.free{flex-direction:row;gap:8px;background:linear-gradient(135deg,#1f6b5a,#2c8f72);border-color:transparent;margin-bottom:10px}
.btn.free.wait{background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.btn[disabled],.btn.off{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.btn:focus-visible,.tab:focus-visible,.rchip:focus-visible{outline:2px solid var(--r4);outline-offset:2px}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700}
.tab i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--text);background:rgba(255,255,255,.06)} .tab.on i{filter:none;opacity:1}

/* ---------- collection ---------- */
.rchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.rchips::-webkit-scrollbar{display:none}
.rchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:8px 10px;border-radius:14px;
  background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.rchip b{font:700 13px var(--disp);color:var(--c)}
.rchip.on{border-color:var(--c);color:var(--text);box-shadow:0 0 0 1px var(--c) inset}
.prog{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.prog .t{font:700 15px var(--disp);color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:.82;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1.5px solid var(--c);box-shadow:0 0 20px -10px var(--c)}
.tile .ic{font-size:38px;line-height:1}
.tile .nm{font-size:12px;font-weight:700;line-height:1.15}
.tile .cnt{position:absolute;top:6px;right:8px;font:700 11px var(--disp);color:var(--c)}
.tile.lock{border:1.5px dashed var(--line);box-shadow:none;background:transparent;color:var(--muted)}
.tile.lock .ic{filter:grayscale(1) brightness(0);opacity:.35}

/* ---------- upgrades ---------- */
.up{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.up .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.up .h b{font:700 15px var(--disp)} .up .h span{font:700 13px var(--disp);color:var(--muted)}
.up p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.lv{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}
.lv i{display:block;height:100%;background:linear-gradient(90deg,#7b5cff,#ffc447)}
.up .btn{flex-direction:row;justify-content:space-between;padding:11px 14px}
.up.main{border-color:rgba(255,196,71,.45);background:linear-gradient(180deg,#2c2257,var(--card))}
.odds{margin:2px 0 12px}
.od{display:grid;grid-template-columns:84px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:12.5px;font-weight:700}
.od .b{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.od .b i{display:block;height:100%;background:var(--c);border-radius:9px}
.od .p{text-align:right;font-variant-numeric:tabular-nums}
.od .p em{display:block;font-style:normal;color:var(--ok);font-size:11px;font-weight:600}

/* ---------- top ---------- */
.lb{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px}
.lb.me{border-color:var(--r4);background:#2c2257}
.lb .n{width:28px;font:700 14px var(--disp);color:var(--muted);text-align:center}
.lb:nth-child(-n+3) .n{color:var(--gold)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lb .sc{text-align:right;font:700 14px var(--disp)} .lb .sc small{display:block;font:600 11.5px var(--body);color:var(--muted)}

/* ---------- reveal overlay ---------- */
#ov{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(10,7,24,.92);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
#ov[hidden]{display:none}
.ovin{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  background:radial-gradient(90% 55% at 50% 38%,var(--glow,transparent),transparent 70%);transition:background .4s}
.ovmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.ovmid>:first-child{margin-top:auto}.ovmid>:last-child{margin-bottom:auto}
.ovmid.single{align-items:center}
.skip{align-self:flex-end;color:var(--muted);font-weight:700;font-size:13px;padding:6px 4px}
.rc{--c:var(--r0);flex:none;display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:16px;border:1.5px solid var(--c);
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 0 22px -8px var(--c);
  opacity:0;transform:translateX(-18px) scale(.97);transition:opacity .28s,transform .28s}
.rc.show{opacity:1;transform:none}
.rc .ic{font-size:26px;line-height:1}
.rc .t{flex:1;min-width:0} .rc .t b{display:block;font-weight:700;line-height:1.2} .rc .t span{font-size:12px;color:var(--c);font-weight:700}
.tag{font:700 11px var(--disp);padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap}
.tag.new{background:var(--c);color:#14102b}
.big{--c:var(--r0);width:min(78vw,300px);padding:34px 20px 26px;border-radius:26px;text-align:center;border:2px solid var(--c);
  background:linear-gradient(180deg,#2b2160,#180f38);box-shadow:0 0 60px -6px var(--c);display:flex;flex-direction:column;align-items:center;gap:8px;
  transform:scale(.5) rotateY(90deg);opacity:0;transition:transform .6s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.big.show{transform:none;opacity:1}
.big .ic{font-size:96px;line-height:1.05}
.big .nm{font:700 20px/1.2 var(--disp)} .big .rk{font-weight:700;color:var(--c);font-size:15px}
.big .tag{margin-top:6px}
.r8.big,.r8.rc,.r8.tile,.r8.rcard,.r8.mt{border-color:transparent;background:linear-gradient(#1b1240,#1b1240) padding-box,conic-gradient(from var(--a,0deg),#9d7bff,#4aa3ff,#2ee6c8,#ff7ad9,#ffc447,#9d7bff) border-box;animation:spinb 5s linear infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinb{to{--a:360deg}}
.banner{margin:2px 0 4px;text-align:center;font-weight:700;color:var(--gold);font-size:13.5px}
.ovbtn{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding-top:12px}

/* ---------- сцена: гача и рулетка ---------- */
.stage{position:relative;height:250px;margin:4px 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;border-radius:22px;cursor:pointer;
  background:radial-gradient(75% 85% at 50% 50%,var(--glow,transparent),transparent 72%)}
.stage.static *{animation:none!important}
.idle{position:relative;width:100%;height:100%}
.idle>*{position:absolute;inset:0;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{width:230px;height:230px;border-radius:50%;background:conic-gradient(#7b5cff,#ff7ad9,#ffc447,#2ee6c8,#4aa3ff,#7b5cff);filter:blur(26px);opacity:.45;animation:spin 9s linear infinite}
.orbit{border-radius:50%;border:1px dashed rgba(255,255,255,.1)}
.o1{width:190px;height:190px;animation:spin 6s linear infinite}
.o2{width:238px;height:238px;animation:spin 10s linear infinite reverse}
.orbit i{position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 2px var(--gold)}
.o2 i{width:8px;height:8px;top:-4px;margin-left:-4px;background:#c9a4ff;box-shadow:0 0 12px 2px #c9a4ff}
.cap{width:128px;height:128px;animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(8px) rotate(-5deg)}to{transform:translateY(-8px) rotate(5deg)}}
.capin{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 44px -4px rgba(157,123,255,.8),inset 0 0 0 3px rgba(255,255,255,.18)}
.col{position:absolute;inset:-25%;background:linear-gradient(180deg,#9d7bff 0 45%,#150f30 45% 55%,#f3efff 55% 100%);animation:spin 5s linear infinite,hue 8s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.gloss{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),transparent 34%),radial-gradient(circle at 70% 80%,rgba(0,0,0,.4),transparent 55%)}
.knob{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:#150f30;border:3px solid #f3efff;box-shadow:0 0 12px rgba(255,255,255,.5)}
.idle>.sp{inset:auto;margin:0;position:absolute;color:#fff;font-size:15px;opacity:0;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.9;transform:scale(1.35) rotate(20deg)}}
.reel{position:relative;width:100%;height:146px;flex:none;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.strip{position:absolute;left:0;top:10px;display:flex;gap:8px;will-change:transform}
.rcard{--c:var(--r0);position:relative;flex:none;width:84px;height:126px;border-radius:14px;border:1.5px solid var(--c);overflow:hidden;
  background:#170f36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .35s,filter .35s}
.rcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,var(--c),transparent 75%);opacity:.3}
.rcard .ic{position:relative;font-size:40px;line-height:1}
.rcard b{position:relative;font:700 9.5px var(--disp);color:var(--c)}
.rcard.dim{opacity:.28;filter:saturate(.5)}
.rcard.win{transform:scale(1.12);box-shadow:0 0 36px 2px var(--c);z-index:2}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(180deg,#fff,var(--gold),#fff);
  box-shadow:0 0 14px 2px rgba(255,207,92,.8);z-index:3;border-radius:3px}
.mark::before,.mark::after{content:"";position:absolute;left:50%;margin-left:-7px;border:7px solid transparent}
.mark::before{top:0;border-top:10px solid var(--gold);border-bottom:0}
.mark::after{bottom:0;border-bottom:10px solid var(--gold);border-top:0}
.mark.tick{animation:tick .12s}
@keyframes tick{50%{transform:scaleX(2.2)}}
.ssub{flex:none;min-height:46px;text-align:center;font:700 17px var(--disp);color:var(--c,var(--text));opacity:0;transform:translateY(6px) scale(.92);transition:.3s cubic-bezier(.2,1.4,.4,1)}
.ssub.on{opacity:1;transform:none}
.ssub small{display:block;margin-top:4px;font:600 12.5px var(--body);color:var(--muted)}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 42%,var(--c),transparent 65%);opacity:0;animation:flash .8s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{10%,50%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(4px)}}
.pt{position:absolute;z-index:6;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);pointer-events:none;animation:pt .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;padding:0 2px}
.mt{--c:var(--r0);position:relative;aspect-ratio:.88;border-radius:12px;border:1.5px solid var(--c);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  box-shadow:0 0 14px -6px var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;text-align:center;
  animation:pop .32s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*55ms)}
.mt .ic{font-size:26px;line-height:1}
.mt b{font:600 8.5px/1.1 var(--body);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mt .nw{position:absolute;top:-6px;right:-4px;font:700 8px var(--disp);background:var(--c);color:#14102b;padding:2px 4px;border-radius:6px}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:40;max-width:88vw;
  background:#2f2563;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.center{display:grid;place-items:center;text-align:center;height:100%;padding:30px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

<script>
/* ===== Связь с базой данных (Supabase / Postgres) =====
   Вся игра живёт в базе: аккаунты, монеты, коллекция, крутки, топ.
   Приложение только показывает данные и вызывает функции базы (RPC). */
const Cloud = (() => {
  const TK = 'gachaup_token';
  const on = () => !!(CLOUD.url && CLOUD.key);
  const base = () => CLOUD.url.replace(/\/$/, '') + '/rest/v1';
  const token = () => { try { return localStorage.getItem(TK) || ''; } catch (e) { return ''; } };
  const setToken = t => { try { t ? localStorage.setItem(TK, t) : localStorage.removeItem(TK); } catch (e) {} };

  // вызов функции базы; p_token подставляется автоматически
  async function rpc(fn, args, noToken) {
    const body = Object.assign({}, args);
    if (!noToken) body.p_token = token();
    let r;
    try {
      r = await fetch(base() + '/rpc/' + fn, {
        method: 'POST',
        headers: Object.assign({ apikey: CLOUD.key, 'Content-Type': 'application/json' }, /^eyJ/.test(CLOUD.key) ? { Authorization: 'Bearer ' + CLOUD.key } : {}),
        body: JSON.stringify(body)
      });
    } catch (e) { throw new Error('Нет связи с сервером. Проверьте интернет.'); }
    if (!r.ok) {
      let m = ''; try { m = (await r.json()).message; } catch (e) {}
      throw new Error(m || 'Ошибка сервера (' + r.status + ')');
    }
    return r.json();
  }
  return { on, rpc, token, setToken };
})();

</script>

    synth: { name: 'Синтвейв', bpm: 108, drums: true, arp: 'sawtooth', arpDiv: 1, bass: 'sawtooth', lead: .35, pad: .8 },
    chip: { name: 'Чиптюн', bpm: 132, drums: true, arp: 'square', arpDiv: 1, bass: 'square', lead: .5, pad: .35 },
  };
  // Am – F – C – G, по 16 шагов на аккорд
  const CH = [[45, 3], [41, 4], [48, 4], [43, 4]];

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const P = () => STYLES[Settings.get().style] || STYLES.synth;

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 1;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    mBus = ctx.createGain(); sBus = ctx.createGain(); mBus.connect(master); sBus.connect(master);
    delay = ctx.createDelay(1); fb = ctx.createGain(); fb.gain.value = .38;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(mBus);
    const len = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    applyVol();
    return ctx;
  }
  function applyVol() {
    if (!ctx) return; const s = Settings.get(), t = ctx.currentTime;
    mBus.gain.setTargetAtTime(s.music ? s.mvol * .8 : 0, t, .05);
    sBus.gain.setTargetAtTime(s.sfx ? s.svol : 0, t, .05);
  }

  /* ----- простые голоса ----- */
  function tone(type, f, t, dur, vol, dest, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.det) osc.detune.value = o.det;
    const a = o.atk || .005, r = o.rel || .08;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, t + Math.max(a, dur - r)); g.gain.linearRampToValueAtTime(0, t + dur);
    let n = osc;
    if (o.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); n = fl; }
    n.connect(g); g.connect(dest); if (o.send) { const sg = ctx.createGain(); sg.gain.value = o.send; g.connect(sg); sg.connect(delay); }

  function noise(t, dur, vol, dest, type, freq, to) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = type; f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, v) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .22); o.connect(g); g.connect(mBus); o.start(t); o.stop(t + .25);
  }

  /* ----- музыка ----- */
  function play(st, t) {
    const p = P(), bar = Math.floor(st / 16) % 4, s16 = st % 16, [root, th] = CH[bar], sd = 60 / p.bpm / 4;
    const third = th, tones = [0, third, 7, 12];
    if (s16 === 0) { // пэд
      [0, third, 7].forEach((iv, i) => {
        tone('sawtooth', mtof(root + 12 + iv), t, sd * 16, .05 * p.pad, mBus, { atk: .6, rel: 1, lp: 900, det: (i - 1) * 9 });
        tone('sawtooth', mtof(root + 12 + iv), t, sd * 16, .04 * p.pad, mBus, { atk: .6, rel: 1, lp: 900, det: (1 - i) * 7 });

    }
    // бас
    if (p.drums ? [0, 3, 6, 8, 11, 14].includes(s16) : [0, 8].includes(s16))

      tone(p.arp, mtof(root + 24 + iv), t, sd * p.arpDiv * .9, p.arp === 'square' ? .035 : .05, mBus, { lp: p.arp === 'sawtooth' ? 2200 : 4000, send: .35, rel: .05 });
    }
    // мелодия
    if (s16 % 2 === 0 && bar !== 0 && Math.random() < p.lead * (bar % 2 ? .9 : .6)) {
      const n = PENT[Math.floor(Math.random() * PENT.length)];
      tone(p.arp === 'square' ? 'square' : 'sine', mtof(n), t, sd * (Math.random() < .5 ? 3 : 5), .09, mBus, { atk: .02, rel: .2, send: .5, lp: 3500 });
    }
    // ударные
    if (p.drums) {
      if (s16 % 4 === 0) kick(t, .5);
      if (s16 === 4 || s16 === 12) { noise(t, .16, .22, mBus, 'highpass', 1800); tone('triangle', 190, t, .1, .12, mBus, { to: 110 }); }

  const sfx = {
    tap() { if (!ok()) return; const t = ctx.currentTime; tone('sine', 880, t, .06, .18, sBus, { to: 1320, rel: .03 }); },
    tick() { if (!ok()) return; const t = ctx.currentTime; tone('square', 1500 + Math.random() * 200, t, .025, .07, sBus, { rel: .02 }); },
    spin() { if (!ok()) return; const t = ctx.currentTime; noise(t, 1.2, .12, sBus, 'bandpass', 300, 3000); tone('sawtooth', 120, t, 1.2, .06, sBus, { to: 600, lp: 1200 }); },
    err() { if (!ok()) return; const t = ctx.currentTime; tone('square', 180, t, .18, .12, sBus, { to: 110, lp: 700 }); },
    coin() { if (!ok()) return; const t = ctx.currentTime; tone('square', 988, t, .07, .12, sBus); tone('square', 1319, t + .07, .2, .12, sBus, { rel: .15 }); },
    up() { if (!ok()) return; const t = ctx.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, t + i * .06, .18, .15, sBus, { send: .2 })); },
    win(r) {
      if (!ok()) return; const t = ctx.currentTime, n = Math.min(9, 3 + r), base = 60 + (r >= 4 ? 5 : 0);
      const sc = [0, 4, 7, 12, 16, 19, 24, 28, 31];
      for (let i = 0; i < n; i++) tone(r >= 3 ? 'triangle' : 'sine', mtof(base + sc[i]), t + i * (r >= 4 ? .07 : .09), .5, .16, sBus, { send: .3, rel: .3 });
      if (r >= 4) { noise(t, .9, .12, sBus, 'highpass', 4000, 9000); tone('sawtooth', mtof(base - 12), t, .8, .1, sBus, { lp: 600, rel: .5 }); }
      if (r >= 6) tone('sine', mtof(base + 36), t + .5, 1.2, .1, sBus, { send: .6, rel: .9 });
    },
  };

  // запуск по первому касанию (ограничение браузера и WebView)
  const unlock = () => { startMusic(); if (ctx && ctx.state !== 'running') ctx.resume(); };
  ['pointerdown', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, unlock, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!ctx) return; document.hidden ? ctx.suspend() : (Settings.get().music || Settings.get().sfx) && ctx.resume(); });

  return {
    ...sfx, STYLES,
    apply() { applyVol(); if (Settings.get().music) startMusic(); else stopMusic(); },
    restart() { stopMusic(); startMusic(); },
  };
})();

async function pull(n, free) {
  if (busy) return;
  if (free && freeAt > Date.now()) return toast('Бесплатная крутка ещё не готова');
  if (!free && S.coins < (n === 10 ? S.price10 : S.price1)) return toast('Не хватает монет');

async function spin(list) {
  const win = list.reduce((a, b) => b.r > a.r ? b : a), st = $('#stage');
  skipFlag = false; st.classList.remove('static');
  const W = 84, G = 8, STEP = W + G, N = 30, WIN = 22;
  const wts = S.chances.map(p => Math.pow(p, .55)), tot = wts.reduce((x, y) => x + y, 0);
  const pickR = () => { let x = Math.random() * tot; for (let i = 0; i < wts.length; i++) { x -= wts[i]; if (x <= 0) return i; } return 0; };
  const rndC = r => Math.floor(Math.random() * CONF.pool[CONF.rar[r].k].length);
  const cards = [];
  for (let i = 0; i < N; i++) {
    let r, c;
    if (i === WIN) { r = win.r; c = win.c; }
    else if (i === WIN + 1 && win.r < 8 && Math.random() < .55) { r = Math.min(8, win.r + 1 + Math.floor(Math.random() * 3)); c = rndC(r); }
    else { r = pickR(); c = rndC(r); }
    cards.push({ r, c });
  }
  const cardHtml = x => { const q = CONF.rar[x.r];
    return `<div class="rcard r${x.r}" style="--c:${RC[x.r]}"><div class="ic">${CONF.pool[q.k][x.c].i}</div><b>${q.name}</b></div>`; };
  st.innerHTML = `<div class="reel" id="reel"><div class="strip" id="strip">${cards.map(cardHtml).join('')}</div><div class="mark" id="mark"></div></div><div class="ssub" id="ssub"></div>`;
  st.style.setProperty('--glow', '#7b5cff33');
  const reel = $('#reel'), strip = $('#strip'), mark = $('#mark'), RW = reel.clientWidth;
  const off = (Math.random() - .5) * W * .7;
  const startX = RW / 2 - W / 2, centerX = RW / 2 - (WIN * STEP + W / 2), dist = centerX - off - startX;
  const T = RM ? 400 : 2400, ease = t => 1 - Math.pow(1 - t, 4);
  reel.classList.add("go"); Sfx.spin();
  await new Promise(res => {
    const t0 = performance.now(); let lastIdx = -1, lastTick = 0;
    const frame = now => {
      const p = skipFlag ? 1 : Math.min(1, (now - t0) / T), x = startX + dist * ease(p) + (p < .08 ? 30 * Math.sin(p / .08 * Math.PI) : 0);
      strip.style.transform = `translate3d(${x}px,0,0)`;
      const idx = Math.floor((RW / 2 - x) / STEP), cd = cards[idx];
      if (idx !== lastIdx && cd) {
        lastIdx = idx; st.style.setProperty('--glow', RC[cd.r] + '44');
        if (now - lastTick > 55 && p < 1) { hap('light'); Sfx.tick(); lastTick = now; }
        mark.classList.remove('tick'); void mark.offsetWidth; mark.classList.add('tick');
      }
      p < 1 ? requestAnimationFrame(frame) : res();
    };
    requestAnimationFrame(frame);
  });

  // ---- приземление ----
  const r = win.r, q = CONF.rar[r], c = RC[r], it = CONF.pool[q.k][win.c];
  reel.classList.remove('go'); [...strip.children].forEach(e => { e.style.transform = ''; e.style.filter = ''; e.style.zIndex = ''; });
  strip.style.transition = 'transform .3s ease-out'; strip.style.transform = `translate3d(${centerX}px,0,0)`;
  [...strip.children].forEach((e, i) => e.classList.add(i === WIN ? 'win' : 'dim'));
  mark.style.cssText = 'opacity:0;transition:opacity .3s';
  stageGlow = c + '88'; st.style.setProperty('--glow', stageGlow);
  const ss = $('#ssub'); ss.style.setProperty('--c', c);
  const cnt = S.own[q.k + ':' + win.c];
  ss.innerHTML = `${it.n}<small>${q.name} · ${win.new ? 'NEW' : 'повтор ×' + cnt}</small>`;
  requestAnimationFrame(() => ss.classList.add('on'));
  if (r >= 4) notif('success'); else hap('heavy'); Sfx.win(r);
  if (!RM) {
    const fl = document.createElement('div'); fl.className = 'flash'; fl.style.setProperty('--c', c); st.appendChild(fl);
    if (r >= 4) { st.classList.add('shake'); setTimeout(() => st.classList.remove('shake'), 460); }
    const br = st.getBoundingClientRect(), rr = reel.getBoundingClientRect();
    const px = rr.left - br.left + rr.width / 2, py = rr.top - br.top + rr.height / 2;
    const k = r >= 6 ? 26 : r >= 4 ? 18 : r >= 2 ? 10 : 5;
    for (let i = 0; i < k; i++) {
      const pt = document.createElement('div'), a = Math.random() * 6.283, d = 70 + Math.random() * 150;
      pt.className = 'pt';
      pt.style.cssText = `left:${px}px;top:${py}px;--c:${r === 8 ? RC[Math.floor(Math.random() * 9)] : c};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation-delay:${Math.random() * .1}s`;
      st.appendChild(pt);
    }
  }
  await sleep(skipFlag || RM ? 100 : r >= 4 ? 600 : 220);

  // ---- ×10: после лучшей карточки показываем все 10 ----
  if (list.length > 1) {
    const sorted = [...list].sort((a, b) => a.r - b.r);
    st.innerHTML = `<div class="mgrid">${sorted.map((x, i) => { const k = CONF.rar[x.r], t = CONF.pool[k.k][x.c];
      return `<div class="mt r${x.r}" style="--c:${RC[x.r]};--i:${i}">${x.new ? '<span class="nw">NEW</span>' : ''}<div class="ic">${t.i}</div><b>${t.n}</b></div>`; }).join('')}</div>`;
    sorted.forEach((x, i) => setTimeout(() => { x.r >= 4 ? notif('success') : hap(x.r >= 2 ? 'medium' : 'soft'); }, i * 55));
    await sleep(skipFlag || RM ? 80 : sorted.length * 40 + 250);
  }
  st.querySelectorAll('.flash,.pt').forEach(e => e.remove());
  stageHTML = st.innerHTML;
}

setState = function (st) { _setState(st); st._t0 = Date.now(); st._c0 = st.coins; const r = $('#rate'); if (r) r.textContent = '+' + fmt(st.rate) + '/с'; };
setInterval(() => {
  if (!S || busy || S._c0 === undefined) return;
  S.coins = S._c0 + Math.floor((Date.now() - S._t0) / 1000) * S.rate; $('#coins').textContent = fmt(S.coins);
  document.querySelectorAll('[data-act=pull]').forEach(b => b.classList.toggle('off', S.coins < (+b.dataset.n === 10 ? S.price10 : S.price1)));
  document.querySelectorAll('[data-act=upg]').forEach(b => { const u = S.upg.find(x => x.key === b.dataset.k); if (u && u.cost !== null) b.classList.toggle('off', S.coins < u.cost); });
}, 1000);
setInterval(async () => {
  if (!S || busy || !Cloud.token()) return;
  const j = await Game.api('state'); if (busy || !j.state) return; setState(j.state);
}, 30000);

// тикающие таймеры на кнопках бонусов
setInterval(() => {
  document.querySelectorAll('[data-until]').forEach(b => {
    const s = Math.max(0, Math.ceil((+b.dataset.until - Date.now()) / 1000));
    b.querySelector('.lbl').textContent = s > 0 ? fmtT(s) : b.dataset.ready;
    b.classList.toggle('off', s > 0);
  });
}, 1000);

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || !S) return;
  const a = t.dataset.act;
  try {
    if (a === 'tab' && t.dataset.v === 'me') { /* профиль */ }
    else if (a === 'tab' && t.dataset.v === 'rank') { await loadRank(); }
    else if (a === 'board') { RANK.b = t.dataset.b; await loadRank(); }
    else if (a === 'daily' || a === 'work') {
      if (t.classList.contains('off')) return toast('Ещё не готово');
      const j = await api(a); notif('success'); toast('+' + fmt(j.gain) + ' монет'); Sfx.coin(); render();
    }
    else if (a === 'icon') { await setIcon(t.dataset.i); render(); }
    else if (a === 'rename') { await api('rename', { name: $('#nm').value }); setAvatar(S.name); toast('Имя сохранено'); render(); }
    else if (a === 'logout') { await doLogout(); }
    else if (a === 'reset') {
      if (!resetArm) { resetArm = true; t.textContent = 'Нажмите ещё раз — всё удалится'; setTimeout(() => { resetArm = false; if (t.isConnected) t.textContent = 'Сбросить прогресс'; }, 4000); return; }
      resetArm = false; await api('reset'); HIST = []; RANK.rows = null; setAvatar(S.name); toast('Прогресс сброшен'); render();
    }
  } catch (er) { toast(er.message); render(); }
});

</script>
<script>
/* ===== Админ-панель (доступна только admin / owner; права проверяет база) ===== */
const AD = { q: '', tab: 'u', seq: 0, t: 0 };
async function loadRole() {
  try { const r = await Cloud.rpc('adm_role', {}); ADM = (typeof r === 'string' && r !== 'user') ? r : ''; } catch (e) { ADM = ''; }
  if (S) render();
}
function ask(title, ph, kind) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'adlg';
    d.innerHTML = `<div class="adbox"><b>${esc(title)}</b>${kind === 'confirm' ? '' : `<input class="inp" ${kind === 'num' ? 'inputmode="numeric"' : ''} placeholder="${esc(ph || '')}" maxlength="60">`}
      <div class="row"><button class="abtn" data-x="0">Отмена</button><button class="abtn" data-x="1" style="background:linear-gradient(135deg,#5b6cff,#8a63ff)">ОК</button></div></div>`;
    document.body.appendChild(d);
    const inp = d.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 60);
    const done = v => { d.remove(); res(v); };
    d.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) done(b.dataset.x === '1' ? (inp ? inp.value.trim() : '1') : null); else if (e.target === d) done(null); });
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(inp.value.trim()); });
  });
}
function admOpen() {
  const a = $('#admin'); AD.tab = 'u'; AD.q = '';
  a.innerHTML = `<div class="abox"><div class="ahead"><button class="aback" data-adm="close">←</button><h2>Админ-панель</h2><span class="own">${ADM === 'owner' ? '👑 владелец' : '🛡 админ'}</span></div>
    <div class="rchips"><button class="rchip on" style="--c:#8a63ff" data-adm="tab" data-t="u">Игроки</button><button class="rchip" style="--c:#8a63ff" data-adm="tab" data-t="l">Журнал</button></div>
    <input class="inp" id="aq" placeholder="Поиск по логину или ID" style="margin-top:10px"><div id="alist"></div></div>`;
  a.classList.add('on'); $('#settings').classList.remove('on'); admLoad();
}
async function admLoad() {
  const my = ++AD.seq, box = $('#alist'); box.innerHTML = '<p class="muted">Загрузка…</p>';
  try {
    if (AD.tab === 'u') {
      const rows = await Cloud.rpc('adm_users', { p_q: AD.q }); if (my !== AD.seq) return;
      box.innerHTML = rows.length ? rows.map(admRow).join('') : '<p class="muted">Никого не найдено</p>';
    } else {
      const rows = await Cloud.rpc('adm_logs', {}); if (my !== AD.seq) return;
      box.innerHTML = rows.length ? rows.map(l => `<div class="alog"><b>${esc(l.actor || '?')}</b> · ${esc(l.act)} · ${esc(l.target || '')} ${esc(l.info || '')}<br>${new Date(l.at).toLocaleString('ru-RU')}</div>`).join('') : '<p class="muted">Пока пусто</p>';
    }
  } catch (e) { if (my === AD.seq) box.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
function admRow(u) {
  const role = u.role || 'user', self = u.username === S.username, id = esc(u.id);
  const canBan = role !== 'owner' && !self && (ADM === 'owner' || role !== 'admin');
  const canRole = ADM === 'owner' && role !== 'owner' && !self;
  const tag = role === 'owner' ? ' 👑' : role === 'admin' ? ' 🛡' : '';
  return `<div class="arow ${u.banned ? 'ban' : ''}"><div class="t"><b>${u.icon ? esc(u.icon) + ' ' : ''}${esc(u.name || u.username)}${tag}${u.banned ? ' 🚫' : ''}</b><span>${fmt(u.coins || 0)} ${COIN}</span></div>
    <small>@${esc(u.username)} · ID ${esc(u.pid)}${u.banned && u.ban_reason ? ' · бан: ' + esc(u.ban_reason) : ''}</small>
    <div class="abtns"><button class="abtn" data-adm="coins" data-id="${id}">＋ Монеты</button>
    ${canBan ? `<button class="abtn red" data-adm="ban" data-id="${id}" data-b="${u.banned ? 0 : 1}">${u.banned ? 'Разбан' : 'Бан'}</button>` : ''}
    ${canRole ? `<button class="abtn" data-adm="role" data-id="${id}" data-r="${role === 'admin' ? 'user' : 'admin'}">${role === 'admin' ? 'Снять админа' : 'Сделать админом'}</button>` : ''}</div></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-adm]'); if (!t) return;
  const a = t.dataset.adm;
  try {
    if (a === 'open') admOpen();
    else if (a === 'close') $('#admin').classList.remove('on');
    else if (a === 'tab') { AD.tab = t.dataset.t; document.querySelectorAll('[data-adm=tab]').forEach(b => b.classList.toggle('on', b === t)); $('#aq').style.display = AD.tab === 'u' ? '' : 'none'; admLoad(); }
    else if (a === 'coins') {
      const v = await ask('Выдать монеты (можно с минусом)', 'например 5000', 'num'); if (v === null) return;
      const n = parseInt(v, 10); if (!n) return toast('Введите число');
      await Cloud.rpc('adm_coins', { p_target: t.dataset.id, p_amount: n });
      toast('Готово'); admLoad(); const j = await Game.api('state'); if (j.state) setState(j.state);
    }
    else if (a === 'ban') {
      const on = t.dataset.b === '1', why = on ? await ask('Причина бана', 'необязательно', 'text') : await ask('Снять бан?', '', 'confirm');
      if (why === null) return;
      await Cloud.rpc('adm_ban', { p_target: t.dataset.id, p_ban: on, p_reason: on ? why : '' }); toast(on ? 'Забанен' : 'Разбанен'); admLoad();
    }
    else if (a === 'role') {
      if (await ask(t.dataset.r === 'admin' ? 'Выдать права админа?' : 'Снять права админа?', '', 'confirm') === null) return;
      await Cloud.rpc('adm_role_set', { p_target: t.dataset.id, p_role: t.dataset.r }); toast('Готово'); admLoad();
    }
  } catch (er) { toast(er.message); }
});
document.addEventListener('input', e => { if (e.target.id !== 'aq') return; AD.q = e.target.value.trim(); clearTimeout(AD.t); AD.t = setTimeout(admLoad, 300); });
</script>
<script>
/* ===== Обязательная регистрация / вход и запуск приложения ===== */
let AUTH_MODE = 'login', authBusy = false;
const authEl = () => $('#auth');

function setAuthMode(m) {
  AUTH_MODE = m;
  document.querySelectorAll('[data-auth=login],[data-auth=reg]').forEach(b => b.classList.toggle('on', b.dataset.auth === m));
  $('#pw2').style.display = m === 'reg' ? '' : 'none';
  $('#ap').autocomplete = m === 'reg' ? 'new-password' : 'current-password';
  $('#abtn').textContent = m === 'reg' ? 'Создать аккаунт' : 'Войти';
  $('#aerr').textContent = '';
}
function showAuth(msg) {
  S = null; TOP = null; HIST = null; stageHTML = ''; stageGlow = ''; busy = false;
  $('#view').innerHTML = '';
  $('#ap').value = ''; $('#ap2').value = ''; document.querySelectorAll('[data-eye]').forEach(b => eyeSet(b, false));
  setAuthMode(AUTH_MODE);
  $('#aerr').textContent = msg || '';
  authEl().classList.add('on');
}
function enterGame(j) {
  Sfx.apply();
  CONF = j.conf; TAB = 'summon'; COL = 0;
  setState(j.state); setAvatar(j.state.name);
  authEl().classList.remove('on');
  render(); loadRole();
}
async function doLogout() {
  await Game.logout(); ADM = ''; $('#admin').classList.remove('on');
  AUTH_MODE = 'login'; $('#au').value = '';
  showAuth();
}
window.onAuthLost = () => showAuth('Сессия истекла. Войдите снова.');

async function submitAuth() {
  if (authBusy) return;
  const u = $('#au').value.trim(), p = $('#ap').value, err = $('#aerr');
  err.textContent = '';
  if (!u || !p) return err.textContent = 'Введите логин и пароль';
  if (AUTH_MODE === 'reg' && p !== $('#ap2').value) return err.textContent = 'Пароли не совпадают';
  authBusy = true; $('#abtn').classList.add('off'); Sfx.apply();
  try {
    const r = AUTH_MODE === 'reg' ? await Game.register(u, p) : await Game.login(u, p);
    if (r.error) { err.textContent = r.error; return; }
    const j = await Game.api('init');
    if (j.error) { err.textContent = j.error; return; }
    enterGame(j);
  } finally { authBusy = false; $('#abtn').classList.remove('off'); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-auth]'); if (!t) return;
  const a = t.dataset.auth;
  if (a === 'login' || a === 'reg') setAuthMode(a);
  else if (a === 'go') submitAuth();
});
authEl().addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });

/* ===== глазок: показать / скрыть пароль ===== */
const EYE_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYE_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg>';
function eyeSet(b, show) {
  const i = document.getElementById(b.dataset.eye); if (!i) return;
  i.type = show ? 'text' : 'password'; b.classList.toggle('on', show);
  b.innerHTML = show ? EYE_OFF : EYE_ON; b.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-eye]'); if (!b) return;
  const i = document.getElementById(b.dataset.eye); eyeSet(b, i.type === 'password'); i.focus();
});

(async function boot() {
  if (window.Capacitor) document.body.classList.add('native');
  if ('serviceWorker' in navigator && !window.Capacitor && /^https?:$/.test(location.protocol) && location.hostname !== 'localhost')
    navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!Cloud.on()) {
    authEl().classList.remove('on');
    $('#view').innerHTML = '<div class="center">База данных не подключена</div>';
    return;
  }
  if (!Cloud.token()) return showAuth();
  const j = await Game.api('init');
  if (j.auth) return;                       // onAuthLost уже показал вход
  if (j.error) {
    $('#view').innerHTML = `<div class="center">${esc(j.error)}<br><br><button class="btn sm" onclick="location.reload()">Повторить</button></div>`;
    return;
  }
  enterGame(j);
})();

</script>
